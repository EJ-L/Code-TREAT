model_specification:
  models: ["glm-4.5"]
  temperature: 0.8
  top_k: 40
  top_p: 0.95

tasks:
  - task: unit_test_generation
    enabled: true
    parameters:
      datasets: [{'symprompt': 'python'}]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 5

      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/unit_test_generation_sample_manifest.json"

  - task: code_translation
    enabled: true
    parameters:
      datasets: [
        {'hackerrank': 'java->python'}, 
        {'polyhumaneval': 'java->python'}
      ]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 5
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 3
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/code_translation_manifest.json"
  
  - task: code_generation
    enabled: true
    parameters:
      datasets: [{'hackerrank': 'java'}]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 2
      sampling_seed: 42
      sampling_manifest_path: ""
    
  - task: vulnerability_detection
    enabled: true
    parameters:
      datasets: ['primevul']
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 3
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/vulnerability_detection_sample_manifest.json"

  - task: code_summarization
    enabled: true
    parameters:
      datasets: [{'github_2023': 'python'}, {'github_2023': 'java'}]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 3
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/code_summarization_sample_manifest.json"

  - task: code_review_generation
    enabled: true
    parameters:
      datasets: [{'github_2023': 'python'}, {'github_2023': 'go'}]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 3
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 2
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/code_review_generation_manifest.json"

  - task: input_prediction
    enabled: true
    parameters:
      datasets: [
        {'hackerrank': 'java'}, 
        {'geeksforgeeks': 'python'}
      ]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 3
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/code_reasoning_input_manifest.json"

  - task: output_prediction
    enabled: true
    parameters:
      datasets: [
        {'hackerrank': 'python'},
        {'geeksforgeeks': 'java'}
      ]
      template_categories: ['direct']
      test_samples: null
      n_requests: 1
      parallel_requests: 10
      save_dir: "results"
      reproduce: true
      sampling_mode: "manifest"
      sample_size: 3
      sampling_seed: 42
      sampling_manifest_path: "replication_manifest_json/code_reasoning_output_manifest.json"
